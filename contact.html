<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Velo Victoria</title>
   <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

 <nav class="normal-nav">
 <div class="left">
      <a href="index.html">Home</a>
    </div>
    <h1 class="logo">VELO VICTORIA</h1>

    <div class="right">
      
      <a href="#" id="openLogin"><i class="fa-regular fa-user"></i></a>
    </div>
  </nav>
  
<section class="container">


  <form class="form">
  
    <div class="field">
      <label>Name</label>
      <input type="text" placeholder="Victoria">
    </div>

    <div class="row">
      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="xyz@gmail.com">
      </div>

      <div class="field">
        <label>Phone number</label>
        <input type="tel" placeholder="987654321">
      </div>
    </div>

    <div class="field">
      <label>Enter your message</label>
      <textarea placeholder="Enter your message here..."></textarea>
    </div>

    <button type="submit">SEND MESSAGE</button>

  </form>


  <div class="contact">
    <h1>Contact Us</h1>
    <p class="contact-subtitle">
      We would love to hear from you.
    </p>

    <p>📞 <strong>Lets talk</strong><br>980136XXXX</p>
    <p>📧 <strong>General Support</strong><br>contact@velovictoria.com</p>
    <p>🌐 <strong>Our Website</strong><br>velovictoria.com</p>
    <p>📍 <strong>Address</strong><br>4FT, VELOVICTORIA, INDIA</p>

  </div>

</section>
  <div class="login-panel" id="loginPanel">

    <span class="close-panel" id="closeLogin">&times;</span>

    <h2>VELO VICTORIA</h2>

    <form>
        <label>Username</label>
        <input type="text">

        <label>Password</label>
        <input type="password">

        <button type="submit">LOGIN</button>
    </form>

</div>
<script src="app.js"></script>
</body>
</html>
